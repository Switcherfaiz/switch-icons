<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>switch-framework-icons catalog</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./page.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html"><img src="../logo.svg" alt="Switch Framework" /><span>switch-framework-icons</span></a>
    <nav>
      <a href="./framework.html">Framework</a>
      <a href="./standalone.html">Independent</a>
      <a href="./icons.html" aria-current="page">Catalog</a>
    </nav>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Toggle light and dark mode">
      <span class="switch_icon_moon theme-moon" aria-hidden="true"></span>
      <span class="switch_icon_sun theme-sun" aria-hidden="true"></span>
    </button>
  </header>

  <div class="catalog-head">
    <h1>All icons <span id="icons-count" class="icons-count"></span></h1>
    <p class="lead">Search and click an icon to copy Switch Framework <code>&lt;sw-icon&gt;</code> or independent <code>span</code> snippets.</p>
    <div class="icons-all-row">
      <div class="icons-search-wrap">
        <span class="switch_icon_search icons-search-icon" aria-hidden="true"></span>
        <input id="icons-search-input" class="icons-search-input" type="search" placeholder="Search icons..." autocomplete="off" />
      </div>
    </div>
  </div>
  <div id="icons-grid" class="icons-grid"></div>
  <div id="icons-load-more-wrap" class="icons-load-more-wrap">
    <button id="icons-load-more" type="button" class="icons-load-more-btn">Load more</button>
  </div>

  <div id="sheet-dim" class="sheet-dim">
    <div class="icon-sheet-panel" role="dialog" aria-label="Icon details">
      <div class="icon-sheet-header">
        <div class="icon-sheet-preview"><span id="icon-sheet-preview-glyph" class="icon-preview-glyph"></span></div>
        <div class="icon-sheet-info">
          <div class="icon-sheet-title-row">
            <button id="icon-sheet-prev" class="icon-sheet-nav-btn" type="button" aria-label="Previous"><span class="switch_icon_chevron_left"></span></button>
            <h3 id="icon-sheet-name" class="icon-sheet-name"></h3>
            <button id="icon-sheet-next" class="icon-sheet-nav-btn" type="button" aria-label="Next"><span class="switch_icon_chevron_right"></span></button>
          </div>
          <p id="icon-sheet-tags" class="icon-sheet-tags"></p>
        </div>
        <div class="icon-sheet-controls">
          <button id="icon-sheet-close" class="icon-sheet-btn-icon" type="button" aria-label="Close"><span class="switch_icon_xmark"></span></button>
        </div>
      </div>
      <div class="icon-sheet-code-block">
        <pre class="icon-sheet-code-pre"><code id="icon-sheet-code-content"></code></pre>
        <button id="icon-sheet-copy-code" class="icon-sheet-copy-code-btn" type="button" aria-label="Copy Switch snippet"><span class="switch_icon_clipboard"></span></button>
      </div>
      <div class="icon-sheet-actions">
        <button id="icon-sheet-copy-sw" class="icon-sheet-btn icon-sheet-btn-primary" type="button">Copy sw-icon</button>
        <button id="icon-sheet-copy-span" class="icon-sheet-btn icon-sheet-btn-secondary" type="button">Copy span</button>
        <button id="icon-sheet-copy-svg" class="icon-sheet-btn icon-sheet-btn-secondary" type="button">Copy SVG</button>
      </div>
    </div>
  </div>
  <p id="toast" hidden></p>
  <script src="./theme.js"></script>
  <script src="./names-embed.js"></script>
  <script src="./catalog.js"></script>
</body>
</html>
